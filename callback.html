<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>auto-post – TikTok connected</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2937; --muted: #6b7280; --accent: #15803d; --box: #f3f4f6; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #e5e7eb; --muted: #9ca3af; --accent: #4ade80; --box: #1f2937; --err: #f87171; } }
  body { background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 32px 16px; }
  main { max-width: 760px; margin: 0 auto; }
  code { display: block; background: var(--box); padding: 12px; border-radius: 8px; word-break: break-all; font-size: 14px; }
  button { margin-top: 12px; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
  .muted { color: var(--muted); } .err { color: var(--err); }
</style>
</head>
<body>
<main>
<h1>auto-post</h1>
<div id="out" class="muted">Reading the response from TikTok…</div>
</main>
<script>
  // TikTok chuyển về đây sau khi người dùng cho phép: ?code=…&scopes=…&state=…  (hoặc ?error=…)
  const q = new URLSearchParams(location.search);
  const out = document.getElementById('out');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  if (q.get('code')) {
    out.className = '';
    out.innerHTML = '<p>✅ TikTok account connected. Copy this authorization code and send it to the app owner (it expires in a few minutes and works only once):</p>'
      + '<code id="c">' + esc(q.get('code')) + '</code><button id="b">Copy code</button>'
      + '<p class="muted">Scopes: ' + esc(q.get('scopes') || '') + '</p>';
    document.getElementById('b').onclick = () => navigator.clipboard.writeText(q.get('code')).then(() => { document.getElementById('b').textContent = 'Copied'; });
  } else if (q.get('error')) {
    out.className = 'err';
    out.textContent = 'TikTok returned an error: ' + q.get('error') + (q.get('error_description') ? ' – ' + q.get('error_description') : '');
  } else {
    out.textContent = 'This page receives the authorization result after connecting a TikTok account to auto-post.';
  }
</script>
</body>
</html>
